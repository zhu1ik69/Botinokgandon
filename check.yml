name: Check schedule

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (минимум для GitHub Actions — 5 минут)
  workflow_dispatch:          # позволяет запускать вручную кнопкой "Run workflow"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run schedule check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check_schedule.py

      - name: Commit updated hash (if changed)
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git add last_hash.txt
          git diff --cached --quiet || git commit -m "update schedule hash"
          git push
